<style>
:root{
  --ink:#16241F; --ink-soft:#4B554F; --forest:#1F3A34; --forest-deep:#12211D;
  --paper:#F5F3EC; --paper-raised:#FFFFFF; --stone:#E7E1D2; --stone-line:#D8CFB9;
  --brass:#AD8A4E; --brass-deep:#8C6B34; --brass-tint:#F1E7D0;
  --sage:#7E9A8C; --danger:#B4463C; --danger-tint:#F6E4E1; --success:#3E6B52; --success-tint:#E4EFE7;
  --amber:#B98A2E; --amber-tint:#F6EAD2;
  --radius-s:4px; --radius-m:8px; --radius-l:14px;
  --shadow-card:0 1px 2px rgba(22,36,31,.06), 0 8px 24px -12px rgba(22,36,31,.18);
  --shadow-pop:0 20px 60px -20px rgba(18,33,29,.45);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%; text-size-adjust:100%; overflow-x:hidden;}
body{
  font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; padding-bottom:64px; min-height:100vh; overflow-x:hidden;
}
@media(min-width:900px){ body{padding-bottom:0;} }
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer;}
.wrap{max-width:1200px; margin:0 auto; padding:0 24px;}
.pad{padding-top:52px; padding-bottom:52px;}
@media(min-width:900px){ .wrap{padding:0 40px;} }

/* ---------- Header ---------- */
.topbar{position:sticky; top:0; z-index:40; background:rgba(245,243,236,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--stone-line);}
.topbar-inner{display:flex; align-items:center; justify-content:space-between; height:64px; max-width:1200px; margin:0 auto; padding:0 20px;}
@media(min-width:900px){ .topbar-inner{padding:0 40px;} }
.brand{display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:1.28rem; color:var(--forest-deep);}
.brand .mark{width:34px; height:34px; border-radius:9px; object-fit:cover; flex-shrink:0;}
.nav-desktop{display:none; gap:28px; align-items:center;}
@media(min-width:900px){ .nav-desktop{display:flex;} }
.nav-desktop a{font-size:.93rem; font-weight:500; color:var(--ink-soft); padding:6px 2px; border-bottom:2px solid transparent;}
.nav-desktop a.active,.nav-desktop a:hover{color:var(--forest-deep); border-color:var(--brass);}
.top-actions{display:flex; align-items:center; gap:10px;}
.top-actions-buttons{display:none; align-items:center; gap:10px;}
@media(min-width:900px){ .top-actions-buttons{display:flex;} }
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:600; font-size:.88rem; padding:10px 18px; border-radius:999px; border:1px solid transparent; transition:transform .12s ease, box-shadow .12s ease, background .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--forest); color:#fff;}
.btn-primary:hover{background:var(--forest-deep);}
.btn-brass{background:var(--brass); color:#fff;}
.btn-brass:hover{background:var(--brass-deep);}
.btn-ghost{background:transparent; color:var(--forest-deep); border-color:var(--stone-line);}
.btn-ghost:hover{background:var(--stone);}
.btn-outline{background:#fff; color:var(--forest-deep); border-color:var(--forest);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{padding:7px 13px; font-size:.8rem;}
.btn-block{width:100%;}
.icon-btn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid var(--stone-line); color:var(--ink-soft);}
.icon-btn:hover{border-color:var(--brass); color:var(--brass-deep);}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(180deg,var(--forest) 0%, var(--forest-deep) 100%); color:#fff; position:relative; overflow:hidden;}
.gate-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background-size:cover; background-position:center; padding:24px;}
.gate-card{width:100%; max-width:440px; background:rgba(255,255,255,.97); border-radius:20px; padding:36px 30px; box-shadow:0 30px 70px rgba(0,0,0,.4); text-align:center;}
.gate-brand{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:22px; font-family:'Fraunces',serif; font-size:1.15rem; color:var(--forest-deep);}
.gate-brand .logo-mark{width:30px; height:30px; border-radius:8px; object-fit:cover; flex-shrink:0;}
.gate-card h1{font-family:'Fraunces',serif; font-size:1.5rem; color:var(--forest-deep); margin-bottom:10px; line-height:1.25;}
.gate-card .sub{font-size:.88rem; color:var(--ink-soft); margin-bottom:22px; line-height:1.5;}
.gate-card form{display:grid; gap:12px; text-align:left; margin-bottom:20px;}
.gate-card .field label{font-size:.75rem; font-weight:600; color:var(--ink-soft); margin-bottom:4px; display:block;}
.gate-divider{display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--ink-soft); font-size:.75rem; text-transform:uppercase; letter-spacing:.05em;}
.gate-divider::before,.gate-divider::after{content:''; flex:1; height:1px; background:var(--stone-line);}
.gate-footnote{margin-top:18px; font-size:.82rem; color:var(--ink-soft);}
.gate-footnote a{color:var(--brass-deep); font-weight:600;}
.gate-trust-line{font-size:.76rem; color:var(--ink-soft); text-align:center; margin-top:2px;}
.hero::after{content:"";position:absolute; inset:0; background:
  radial-gradient(600px 300px at 85% -10%, rgba(173,138,78,.35), transparent 60%);}
.hero-inner{position:relative; max-width:1200px; margin:0 auto; padding:56px 20px 64px; display:grid; gap:36px;}
@media(min-width:960px){ .hero-inner{padding:88px 40px 90px; grid-template-columns:1.15fr .85fr; align-items:center;} }
.eyebrow{display:inline-flex; align-items:center; gap:8px; color:var(--brass-tint); font-size:.8rem; letter-spacing:.02em; margin-bottom:18px; opacity:.85;}
.eyebrow span{width:6px; height:6px; border-radius:50%; background:var(--brass);}
.hero h1{font-size:2.3rem; line-height:1.12; font-weight:600; max-width:15ch;}
@media(min-width:640px){ .hero h1{font-size:3.1rem;} }
@media(min-width:1100px){ .hero h1{font-size:3.6rem;} }
.hero p.sub{margin-top:18px; font-size:1.05rem; color:#DCE6DF; max-width:46ch; line-height:1.6;}
.hero-visual{display:none;}
@media(min-width:960px){
  .hero-visual{display:block; position:relative; height:420px;}
  .hero-visual img{position:absolute; border-radius:16px; object-fit:cover; box-shadow:var(--shadow-pop);}
  .hv1{width:78%; height:280px; top:0; right:0;}
  .hv2{width:52%; height:200px; bottom:0; left:0; border:5px solid var(--forest-deep);}
  .hero-stat{position:absolute; bottom:20px; right:20px; background:#fff; color:var(--ink); border-radius:12px; padding:14px 18px; box-shadow:var(--shadow-pop); min-width:150px;}
  .hero-stat b{font-family:'Fraunces',serif; font-size:1.5rem; display:block; color:var(--forest-deep);}
  .hero-stat span{font-size:.75rem; color:var(--ink-soft);}
}

/* Search card */
.search-card{background:#fff; border-radius:var(--radius-l); padding:18px; box-shadow:var(--shadow-pop); margin-top:30px; display:grid; gap:12px;}
@media(min-width:960px){ .hero-inner{padding-bottom:0;} .search-card{margin-top:34px; grid-column:1/-1;} }
.search-grid{display:grid; gap:10px; grid-template-columns:1fr;}
@media(min-width:760px){ .search-grid{grid-template-columns:1.3fr 1fr 1fr 1fr auto;} }
.field label{display:block; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%; border:1px solid var(--stone-line); border-radius:var(--radius-m); padding:10px 12px; font-size:.9rem; font-family:inherit; background:var(--paper); color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass);}
.search-card .btn{height:42px; align-self:end;}
.trust-strip{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; background:#fff; border:1px solid var(--stone-line); border-radius:var(--radius-l); padding:24px 18px; box-shadow:var(--shadow-card);}
.trust-banner{background-size:cover; background-position:center; padding:64px 20px; text-align:center; margin:20px 0;}
.trust-quote{font-family:'Fraunces',serif; font-size:1.4rem; line-height:1.5; color:#fff; max-width:640px; margin:0 auto 12px; font-style:italic;}
.trust-quote-sub{color:var(--brass-tint); font-size:.85rem; font-weight:600; letter-spacing:.03em; margin-bottom:26px;}
.trust-badges{display:flex; flex-wrap:wrap; justify-content:center; gap:12px 22px;}
.trust-badges span{color:#fff; font-size:.82rem; font-weight:600; opacity:.95;}
@media(min-width:640px){ .trust-quote{font-size:1.7rem;} .trust-banner{padding:80px 20px;} }
@media(min-width:640px){ .trust-strip{grid-template-columns:repeat(4,1fr);} }
.trust-item{text-align:center; padding:6px;}
.trust-item b{display:block; font-family:'Fraunces',serif; font-size:1.9rem; color:var(--forest-deep);}
.trust-item span{font-size:.78rem; color:var(--ink-soft); font-weight:500;}

/* ---------- Sections ---------- */
section.pad{padding:56px 0;}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
.section-head h2{font-size:1.7rem; font-weight:600; color:var(--forest-deep);}
.section-head p{color:var(--ink-soft); margin-top:6px; font-size:.95rem;}
.link-more{font-weight:600; font-size:.87rem; color:var(--brass-deep); border-bottom:1px solid var(--brass); padding-bottom:2px;}

.chip-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:26px;}
.chip{flex:none; padding:9px 16px; border-radius:999px; border:1px solid var(--stone-line); background:#fff; font-size:.85rem; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
.chip.active{background:var(--forest); border-color:var(--forest); color:#fff;}

.grid-cards{display:grid; gap:22px; grid-template-columns:1fr;}
@media(min-width:640px){ .grid-cards{grid-template-columns:1fr 1fr;} }
@media(min-width:1000px){ .grid-cards{grid-template-columns:1fr 1fr 1fr;} }
.grid-cards.list-view{grid-template-columns:1fr;}

.card-prop{background:#fff; border-radius:var(--radius-l); overflow:hidden; box-shadow:var(--shadow-card); border:1px solid var(--stone-line); transition:transform .15s ease, box-shadow .15s ease; display:flex; flex-direction:column;}
.card-prop:hover{transform:translateY(-3px); box-shadow:0 24px 48px -20px rgba(18,33,29,.3);}
.list-view .card-prop{flex-direction:row;}
.list-view .card-prop .cp-img{width:280px; flex:none; height:auto;}
.cp-img{position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--stone);}
.cp-img img{width:100%; height:100%; object-fit:cover;}
.cp-badges{position:absolute; top:10px; left:10px; display:flex; gap:6px; flex-wrap:wrap;}
.badge{font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:5px 9px; border-radius:5px; background:#fff; color:var(--forest-deep);}
.badge.featured{background:var(--brass); color:#fff;}
.badge.available{background:var(--success-tint); color:var(--success);}
.badge.hold{background:var(--amber-tint); color:var(--amber);}
.badge.sold{background:var(--danger-tint); color:var(--danger);}
.badge.pending{background:var(--amber-tint); color:var(--amber);}
.badge.rejected{background:var(--danger-tint); color:var(--danger);}
.cp-fav{position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; border:none;}
.cp-body{padding:16px; display:flex; flex-direction:column; gap:8px; flex:1;}
.cp-type{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--brass-deep);}
.cp-title{font-family:'Fraunces',serif; font-size:1.08rem; font-weight:600; line-height:1.3; color:var(--forest-deep);}
.cp-loc{font-size:.83rem; color:var(--ink-soft); display:flex; align-items:center; gap:5px;}
.cp-meta{display:flex; gap:14px; font-size:.8rem; color:var(--ink-soft); border-top:1px dashed var(--stone-line); padding-top:10px; margin-top:2px;}
.cp-price{font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem; color:var(--forest-deep);}
.cp-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px;}

/* Categories */
.cat-grid{display:grid; gap:14px; grid-template-columns:repeat(2,1fr);}
@media(min-width:700px){ .cat-grid{grid-template-columns:repeat(3,1fr);} }
@media(min-width:1000px){ .cat-grid{grid-template-columns:repeat(6,1fr);} }
.cat-card{background:#fff; border:1px solid var(--stone-line); border-radius:var(--radius-l); padding:0 0 16px; text-align:left; overflow:hidden; transition:border-color .15s, transform .15s;}
.cat-card:hover{border-color:var(--brass); transform:translateY(-2px);}
.cat-photo{position:relative; height:100px; overflow:hidden;}
.cat-photo img{width:100%; height:100%; object-fit:cover; display:block;}
.cat-card .ico{position:absolute; left:14px; bottom:-16px; width:36px; height:36px; border-radius:9px; background:var(--forest-deep); color:var(--brass-tint); display:flex; align-items:center; justify-content:center; font-size:1.05rem; box-shadow:0 4px 10px rgba(0,0,0,.25);}
.cat-card b{display:block; font-family:'Fraunces',serif; font-size:1rem; margin:26px 16px 2px; color:var(--forest-deep);}
.cat-card span{display:block; font-size:.78rem; color:var(--ink-soft); margin:0 16px;}

/* Why us */
.why-grid{display:grid; gap:20px; grid-template-columns:1fr;}
@media(min-width:760px){ .why-grid{grid-template-columns:repeat(4,1fr); gap:26px;} }
.why-item{background:#fff; border:1px solid var(--stone-line); border-radius:var(--radius-l); padding:22px 20px; box-shadow:var(--shadow-card);}
.why-item .num{font-family:'Fraunces',serif; font-size:.85rem; color:var(--brass-deep); font-weight:600; margin-bottom:10px;}
.why-item h3{font-size:1.08rem; margin-bottom:8px; color:var(--forest-deep);}
.why-item p{font-size:.88rem; color:var(--ink-soft); line-height:1.6;}

.cta-band{background:var(--forest-deep); color:#fff; border-radius:var(--radius-l); padding:42px 30px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px;}
.cta-band h2{font-size:1.6rem; max-width:26ch;}
.cta-band p{color:#CBD8D0; margin-top:8px; font-size:.92rem;}

footer{background:var(--ink); color:#CBD3CC; padding:50px 0 90px;}
@media(min-width:900px){ footer{padding:50px 0 30px;} }
.foot-grid{display:grid; gap:30px; grid-template-columns:1fr; margin-bottom:34px;}
@media(min-width:760px){ .foot-grid{grid-template-columns:2fr 1fr 1fr 1fr;} }
.foot-grid h4{color:#fff; font-size:.85rem; margin-bottom:14px; text-transform:uppercase; letter-spacing:.03em;}
.foot-grid a,.foot-grid p{font-size:.86rem; color:#A8B2A9; line-height:2;}
.foot-bottom{border-top:1px solid rgba(255,255,255,.1); padding-top:20px; font-size:.8rem; color:#7E8A7F; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}

/* ---------- Filters / listing page ---------- */
.listing-head{background:#fff; border-bottom:1px solid var(--stone-line); padding:22px 0;}
.filters-bar{display:grid; gap:10px; grid-template-columns:1fr;}
@media(min-width:900px){ .filters-bar{grid-template-columns:repeat(6,1fr) auto;} }
.filters-toggle{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
@media(min-width:900px){ .filters-toggle{display:none;} }
.filters-panel{display:none;}
.filters-panel.open{display:grid;}
@media(min-width:900px){ .filters-panel{display:grid !important;} }
.result-toolbar{display:flex; align-items:center; justify-content:space-between; margin:22px 0 18px; flex-wrap:wrap; gap:12px;}
.view-toggle{display:flex; border:1px solid var(--stone-line); border-radius:999px; overflow:hidden;}
.view-toggle button{padding:8px 14px; background:#fff; border:none; font-size:.85rem; font-weight:600; color:var(--ink-soft);}
.view-toggle button.active{background:var(--forest); color:#fff;}
.empty-state{text-align:center; padding:70px 20px; color:var(--ink-soft);}
.empty-state h3{font-family:'Fraunces',serif; color:var(--forest-deep); font-size:1.3rem; margin-bottom:8px;}
.pagination{display:flex; justify-content:center; gap:8px; margin:34px 0;}
.pagination button{width:36px; height:36px; border-radius:50%; border:1px solid var(--stone-line); background:#fff; font-weight:600; font-size:.85rem;}
.pagination button.active{background:var(--forest); color:#fff; border-color:var(--forest);}

/* ---------- Property detail ---------- */
.pd-hero{padding:26px 0 0;}
.breadcrumb{font-size:.8rem; color:var(--ink-soft); margin-bottom:14px; display:flex; gap:6px; flex-wrap:wrap;}
.breadcrumb a{color:var(--brass-deep); font-weight:600;}
.gallery{display:grid; gap:8px; grid-template-columns:1fr; border-radius:var(--radius-l); overflow:hidden;}
@media(min-width:800px){ .gallery{grid-template-columns:2fr 1fr; height:420px;} }
.gallery .main-img{cursor:pointer; overflow:hidden; height:280px;}
@media(min-width:800px){ .gallery .main-img{height:100%;} }
.gallery .main-img img{width:100%; height:100%; object-fit:cover;}
.gallery .side-imgs{display:none;}
@media(min-width:800px){ .gallery .side-imgs{display:grid; grid-template-rows:1fr 1fr; gap:8px; height:100%;} }
.gallery .side-imgs .thumb{overflow:hidden; position:relative; cursor:pointer;}
.gallery .side-imgs .thumb img{width:100%; height:100%; object-fit:cover;}
.gallery .side-imgs .thumb .more-overlay{position:absolute; inset:0; background:rgba(18,33,29,.6); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.1rem;}
.thumbstrip{display:flex; gap:8px; overflow-x:auto; margin-top:10px;}
.thumbstrip img{width:76px; height:56px; object-fit:cover; border-radius:6px; cursor:pointer; border:2px solid transparent; flex:none;}
.thumbstrip img.active{border-color:var(--brass);}

.pd-layout{display:grid; gap:34px; grid-template-columns:1fr; margin-top:30px;}
@media(min-width:960px){ .pd-layout{grid-template-columns:1.6fr 1fr; align-items:start;} }
.pd-top{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start; margin-bottom:14px;}
.pd-title{font-size:1.6rem; font-weight:600; color:var(--forest-deep); max-width:32ch;}
.pd-loc{color:var(--ink-soft); margin-top:8px; font-size:.95rem;}
.pd-price{font-family:'Fraunces',serif; font-size:1.9rem; font-weight:600; color:var(--forest-deep); white-space:nowrap;}
.pd-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
.spec-grid{display:grid; gap:14px; grid-template-columns:repeat(2,1fr); background:#fff; border:1px solid var(--stone-line); border-radius:var(--radius-l); padding:20px; margin:22px 0;}
@media(min-width:600px){ .spec-grid{grid-template-columns:repeat(3,1fr);} }
.spec-grid div span{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:3px;}
.spec-grid div b{font-size:.92rem; color:var(--forest-deep);}
.pd-block{margin-bottom:28px;}
.pd-block h3{font-size:1.15rem; color:var(--forest-deep); margin-bottom:12px;}
.pd-block p{color:var(--ink-soft); line-height:1.75; font-size:.95rem;}
.feat-list{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(min-width:600px){ .feat-list{grid-template-columns:1fr 1fr 1fr;} }
.feat-list li{list-style:none; font-size:.87rem; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}
.feat-list li::before{content:"✓"; color:var(--success); font-weight:700;}
.map-embed{border-radius:var(--radius-m); overflow:hidden; border:1px solid var(--stone-line); height:280px; background:var(--stone); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:.85rem; flex-direction:column; gap:8px;}

.contact-card{background:#fff; border:1px solid var(--stone-line); border-radius:var(--radius-l); padding:22px; box-shadow:var(--shadow-card); position:sticky; top:84px;}
.contact-card h3{font-size:1.05rem; color:var(--forest-deep); margin-bottom:4px;}
.contact-card p.note{font-size:.82rem; color:var(--ink-soft); margin-bottom:16px;}
.contact-card .btn{margin-bottom:10px;}
.id-tag{font-size:.75rem; color:var(--ink-soft); background:var(--stone); border-radius:6px; padding:6px 10px; display:inline-block; margin-top:10px;}
.similar-wrap{margin-top:50px;}

/* ---------- Auth ---------- */
.auth-wrap{min-height:80vh; display:flex; align-items:center; justify-content:center; padding:50px 20px; background-size:cover; background-position:center;}
.auth-card{width:100%; max-width:420px; background:rgba(255,255,255,.97); border:1px solid var(--stone-line); border-radius:var(--radius-l); padding:34px 28px; box-shadow:0 24px 60px rgba(0,0,0,.35);}
.auth-card h2{font-size:1.5rem; color:var(--forest-deep); margin-bottom:6px;}
.auth-card p.sub{color:var(--ink-soft); font-size:.88rem; margin-bottom:24px;}
.field-stack{display:grid; gap:14px; margin-bottom:18px;}
.auth-switch{text-align:center; font-size:.87rem; color:var(--ink-soft); margin-top:16px;}
.auth-switch a{color:var(--brass-deep); font-weight:600;}
.demo-box{margin-top:18px; background:var(--paper); border:1px dashed var(--stone-line); border-radius:var(--radius-m); padding:12px 14px; font-size:.78rem; color:var(--ink-soft); line-height:1.7;}

/* ---------- Dashboard ---------- */
.dash-shell{display:flex; min-height:calc(100vh - 64px);}
.dash-side{display:none;}
@media(min-width:900px){
  .dash-side{display:block; width:240px; flex:none; background:#fff; border-right:1px solid var(--stone-line); padding:24px 14px;}
  .dash-side a{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--radius-m); font-size:.88rem; font-weight:500; color:var(--ink-soft); margin-bottom:2px;}
  .dash-side a.active{background:var(--forest); color:#fff;}
  .dash-side a:hover:not(.active){background:var(--stone);}
  .dash-side .side-label{font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding:14px 14px 6px;}
}
.dash-main{flex:1; padding:24px 18px 40px; min-width:0;}
@media(min-width:900px){ .dash-main{padding:30px 36px 50px;} }
.dash-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:22px;}
.dash-head h1{font-size:1.5rem; color:var(--forest-deep);}
.dash-head p{color:var(--ink-soft); font-size:.88rem; margin-top:4px;}
.mobile-dash-tabs{display:flex; gap:8px; overflow-x:auto; margin-bottom:20px; padding-bottom:4px;}
@media(min-width:900px){ .mobile-dash-tabs{display:none;} }
.mobile-dash-tabs a{flex:none; padding:8px 14px; border-radius:999px; background:#fff; border:1px solid var(--stone-line); font-size:.82rem; font-weight:600; color:var(--ink-soft);}
.mobile-dash-tabs a.active{background:var(--forest); border-color:var(--forest); color:#fff;}

.stat-grid{display:grid; gap:14px; grid-template-columns:repeat(2,1fr); margin-bottom:30px;}
@media(min-width:700px){ .stat-grid{grid-template-columns:repeat(3,1fr);} }
@media(min-width:1100px){ .stat-grid{grid-template-columns:repeat(6,1fr);} }
.stat-card{background:#fff; border:1px solid var(--stone-line); border-radius:var(--radius-m); padding:16px;}
.stat-card b{display:block; font-family:'Fraunces',serif; font-size:1.55rem; color:var(--forest-deep);}
.stat-card span{font-size:.76rem; color:var(--ink-soft); font-weight:500;}

.panel{background:#fff; border:1px solid var(--stone-line); border-radius:var(--radius-l); overflow:hidden;}
.panel-head{padding:16px 18px; border-bottom:1px solid var(--stone-line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
.panel-head h3{font-size:1.02rem; color:var(--forest-deep);}
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:.85rem; min-width:640px;}
th{text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); padding:10px 16px; border-bottom:1px solid var(--stone-line); background:var(--paper);}
td{padding:12px 16px; border-bottom:1px solid var(--stone-line); vertical-align:middle; color:var(--ink);}
tr:last-child td{border-bottom:none;}
.row-thumb{width:52px; height:40px; object-fit:cover; border-radius:5px; flex:none;}
.row-title{display:flex; align-items:center; gap:10px;}
.row-title b{font-size:.85rem; color:var(--forest-deep); display:block; max-width:220px;}
.row-title small{color:var(--ink-soft); font-size:.76rem;}
.actions-cell{display:flex; gap:6px; flex-wrap:wrap;}
.tag-select{border:1px solid var(--stone-line); border-radius:6px; padding:5px 8px; font-size:.78rem; background:#fff;}

/* Property form */
.form-section{background:#fff; border:1px solid var(--stone-line); border-radius:var(--radius-l); padding:22px; margin-bottom:20px;}
.form-section h3{font-size:1rem; color:var(--forest-deep); margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--stone-line);}
.form-grid{display:grid; gap:14px; grid-template-columns:1fr;}
@media(min-width:700px){ .form-grid{grid-template-columns:1fr 1fr;} }
.form-grid.cols-3{grid-template-columns:1fr;}
@media(min-width:700px){ .form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;} }
.field.span-2{grid-column:1/-1;}
.checkline{display:flex; align-items:center; gap:8px; font-size:.87rem; color:var(--ink-soft);}
.img-url-row{display:flex; gap:8px; margin-bottom:8px;}
.img-url-row input{flex:1;}
.img-thumb-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin-top:12px;}
.img-thumb{position:relative; border-radius:8px; overflow:hidden; border:2px solid var(--stone-line); aspect-ratio:4/3;}
.img-thumb.cover{border-color:var(--brass);}
.img-thumb img{width:100%; height:100%; object-fit:cover;}
.img-thumb .cover-tag{position:absolute; top:4px; left:4px; background:var(--brass); color:#fff; font-size:.6rem; font-weight:700; padding:2px 6px; border-radius:4px; text-transform:uppercase;}
.img-thumb button{position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(18,33,29,.75); color:#fff; border:none; font-size:.75rem; line-height:1;}
.img-thumb .set-cover-btn{position:absolute; bottom:4px; left:4px; right:4px; font-size:.65rem; padding:4px; background:rgba(255,255,255,.92); border-radius:4px; border:none; font-weight:600; color:var(--forest-deep); opacity:0; transition:opacity .15s;}
.img-thumb:hover .set-cover-btn{opacity:1;}
.upload-drop{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; border:2px dashed var(--stone-line); border-radius:var(--radius-m); padding:26px 16px; cursor:pointer; background:var(--paper); transition:border-color .15s ease, background .15s ease;}
.upload-drop:hover,.upload-drop.drag-over{border-color:var(--brass); background:var(--brass-tint);}
.upload-drop-icon{font-size:1.6rem;}
.upload-drop-text{font-size:.88rem; color:var(--ink);}
.upload-drop-text b{color:var(--forest-deep);}
.upload-drop-hint{font-size:.72rem; color:var(--ink-soft);}
.video-thumb{position:relative; margin-top:12px; border-radius:8px; overflow:hidden; border:2px solid var(--stone-line); max-width:280px; background:#000;}
.video-thumb video{width:100%; display:block; max-height:180px;}
.video-thumb button{position:absolute; top:6px; right:6px; font-size:.7rem; font-weight:600; padding:5px 9px; border-radius:999px; background:rgba(18,33,29,.75); color:#fff; border:none;}
.form-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:6px;}

/* ---------- Mobile bottom nav ---------- */
.mobile-nav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--stone-line); display:flex; z-index:50; box-shadow:0 -4px 16px rgba(0,0,0,.06);}
@media(min-width:900px){ .mobile-nav{display:none;} }
.mobile-nav a{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 8px; font-size:.65rem; font-weight:600; color:var(--ink-soft);}
.mobile-nav a.active{color:var(--forest);}
.mobile-nav .mn-ico{font-size:1.15rem; line-height:1;}
.mobile-menu-btn{display:flex; width:38px; height:38px; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--stone-line); background:#fff;}
@media(min-width:900px){ .mobile-menu-btn{display:none;} }
.drawer{position:fixed; inset:0; z-index:60; display:none;}
.drawer.open{display:block;}
.drawer .scrim{position:absolute; inset:0; background:rgba(18,33,29,.5);}
.drawer .panel-slide{position:absolute; top:0; right:0; bottom:0; width:78%; max-width:320px; background:#fff; padding:22px; overflow-y:auto;}
.drawer a{display:block; padding:12px 4px; font-size:.95rem; font-weight:600; color:var(--ink); border-bottom:1px solid var(--stone-line);}

/* ---------- Toast / Modal ---------- */
#toast-host{position:fixed; top:80px; right:20px; z-index:100; display:flex; flex-direction:column; gap:10px; max-width:320px;}
.toast{background:var(--forest-deep); color:#fff; padding:12px 16px; border-radius:var(--radius-m); font-size:.85rem; box-shadow:var(--shadow-pop); animation:toastIn .2s ease;}
.toast.error{background:var(--danger);}
.toast.success{background:var(--success);}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
.modal-scrim{position:fixed; inset:0; background:rgba(18,33,29,.55); z-index:90; display:flex; align-items:flex-end; justify-content:center; padding:0;}
@media(min-width:700px){ .modal-scrim{align-items:center; padding:20px;} }
.modal-box{background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:26px;}
@media(min-width:700px){ .modal-box{border-radius:16px;} }
.modal-box h3{font-size:1.15rem; color:var(--forest-deep); margin-bottom:16px;}
.share-opt{display:flex; align-items:center; gap:14px; padding:13px 6px; border-bottom:1px solid var(--stone-line); font-size:.92rem; font-weight:500;}
.share-opt .sicon{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; background:var(--stone);}

.lightbox{position:fixed; inset:0; background:rgba(10,16,14,.95); z-index:95; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px;}
.lightbox img{max-width:100%; max-height:74vh; border-radius:8px; object-fit:contain;}
.lightbox .lb-close{position:absolute; top:18px; right:18px; color:#fff; font-size:1.6rem; background:none; border:none;}
.lightbox .lb-nav{display:flex; gap:20px; margin-top:20px;}
.lightbox .lb-nav button{background:rgba(255,255,255,.12); color:#fff; border:none; width:44px; height:44px; border-radius:50%; font-size:1.1rem;}
.lightbox .lb-count{color:#DCE6DF; margin-top:12px; font-size:.82rem;}

.hidden{display:none !important;}
.muted{color:var(--ink-soft);}
.center-note{text-align:center; padding:60px 20px; color:var(--ink-soft);}
</style>
</head>

/* =========================================================================
   BACKEND CONFIG — fill these in with your Supabase project details.
   Get them from: Supabase Dashboard → Project Settings → API
   Until filled in, the app runs on browser-only storage (demo mode) so
   nothing breaks — but data will NOT be shared across devices/users.

const sb = BACKEND_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* =========================================================================
   DATA LAYER — shared data (users, properties, leads, customers, settings)
   is persisted to a real Postgres database via Supabase, so every device
   and every user sees the same live data. Device-only data (which user is
   logged into THIS browser, saved/favourited properties) stays in
   localStorage, since that is correctly per-device, not shared.
   ========================================================================= */
let DB = { users: [], properties: [], leads: [], favorites: [], customers: [] };

const slugify = s => s.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-');
const money = n => { n = Number(n)||0;
  if(n >= 10000000) return '₹' + (n/10000000).toFixed(n%10000000===0?0:2) + ' Cr';
  if(n >= 100000) return '₹' + (n/100000).toFixed(n%100000===0?0:2) + ' Lac';
  return '₹' + n.toLocaleString('en-IN');
};
const esc = s => (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='default'){
  const host = document.getElementById('toast-host');
  const t = document.createElement('div');
  t.className = 'toast' + (type!=='default' ? ' '+type : '');
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(),250); }, 2600);
}

async function storeGet(key, shared){
  // Shared data (users, properties, leads, customers, settings) lives in the
  // real Supabase database, so it's the same for every visitor everywhere.
  if(shared && BACKEND_ENABLED){
    try{
      const { data, error } = await sb.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      if(data && data.value !== undefined && data.value !== null) return data.value;
      return null;
    }catch(e){ console.error('Supabase read failed for', key, e); }
  }
  // Device-only data (which user is logged into this browser, saved
  // properties) — and the demo fallback (any key) when no backend is
  // configured yet, so the app still works before Supabase is wired up.
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const r = await window.storage.get(key, !!shared);
      if(r && r.value !== undefined && r.value !== null){
        try { return typeof r.value === 'string' ? JSON.parse(r.value) : r.value; } catch(e){ return r.value; }
      }
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem((shared?'shared:':'local:')+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function storeSet(key, value, shared){
  if(shared && BACKEND_ENABLED){
    try{
      const { error } = await sb.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
      if(error) throw error;
      return true;
    }catch(e){ console.error('Supabase write failed for', key, e); return false; }
  }
  try{
    if(window.storage && typeof window.storage.set==='function'){
      await window.storage.set(key, value, !!shared);
    }
  }catch(e){}
  try{
    localStorage.setItem((shared?'shared:':'local:')+key, JSON.stringify(value));
    return true;
  }catch(e){ return false; }
}

async function loadDB(){
  const [u,p,l,s,c] = await Promise.all([
    storeGet('users',true), storeGet('properties',true), storeGet('leads',true), storeGet('siteSettings',true), storeGet('customers',true)
  ]);
  const defaults = {
    siteName:'Property Finder',
    address:'Sanjay Place, Agra, UP',
    phone:'+91 98765 00000',
    email:'hello@realestateportal.in',
    whatsapp:'919876500000',
    officeHours:'Mon–Sat, 10am – 7pm'
  };
  // Initialize each collection independently. Never reseed just because
  // the property list is empty; otherwise deleted properties would return on reload.
  if(!Array.isArray(u)) { seedData(); await persistAll(); }
  else {
    DB.users = u;
    DB.properties = Array.isArray(p) ? p : [];
    DB.leads = Array.isArray(l) ? l : [];
    DB.customers = Array.isArray(c) ? c : [];
    DB.settings = Object.assign({}, defaults, s || {});
    if(!Array.isArray(p)) await persistProperties();
    if(!Array.isArray(l)) await persistLeads();
    if(!Array.isArray(c)) await persistCustomers();
    if(!s) await persistSettings();
  }
  if(!DB.settings) DB.settings = defaults;
  const sess = await storeGet('session', false);
  SESSION = sess && sess.userId ? sess.userId : null;
  const custSess = await storeGet('customerSession', false);
  DB.customerSession = custSess && custSess.id ? custSess : null;
  const favs = await storeGet('favorites', false);
  DB.favorites = Array.isArray(favs) ? favs : [];
}
async function persistAll(){
  await Promise.all([
    storeSet('users',DB.users,true),
    storeSet('properties',DB.properties,true),
    storeSet('leads',DB.leads,true),
    storeSet('customers',DB.customers,true),
    storeSet('siteSettings',DB.settings,true)
  ]);
}
async function persistUsers(){ await storeSet('users',DB.users,true); }
async function persistSettings(){ await storeSet('siteSettings',DB.settings,true); }
function siteSettings(){

async function persistCustomers(){ await storeSet('customers',DB.customers,true); }
async function persistFavorites(){ await storeSet('favorites', DB.favorites, false); }


function recordLoginActivity(user){
  try{
    const now = new Date().toISOString();
    const users = DB.users || [];
    const u = users.find(x => x.id === user.id);
    if(!u) return;
    u.lastLoginAt = now;
    u.loginCount = (u.loginCount || 0) + 1;
    u.loginHistory = Array.isArray(u.loginHistory) ? u.loginHistory : [];
    u.loginHistory.unshift({
      at: now,
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
      browser: navigator.userAgent
    });
    u.loginHistory = u.loginHistory.slice(0, 50);
    DB.users = users;
    storeSet('users', users, true);
  }catch(e){}
}

function currentUser(){ return DB.users.find(u=>u.id===SESSION) || null; }
function associateName(id){ const u = DB.users.find(x=>x.id===id); return u ? u.name : 'Unassigned'; }

const PROPERTY_TYPES = ['Residential','Commercial','Agricultural','Industrial','Farm House'];

function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);

function parseHash(){
  const raw = location.hash.slice(1) || '/';
  const [path, qs] = raw.split('?');
  const params = new URLSearchParams(qs||'');
  const segs = path.split('/').filter(Boolean);
  return {path, segs, params};
}

async function render(){
  window.scrollTo(0,0);
  closeDrawer();
  const {path, segs, params} = parseHash();
  const app = document.getElementById('app');
  if(SESSION && !DB.users.find(x=>x.id===SESSION)){ const s=await storeGet('users',true); if(Array.isArray(s)){ DB.users=s; } }

  const gateAllowedPaths = ['login','register'];
  if(isGated() && !gateAllowedPaths.includes(segs[0])){
    renderHeader(); renderMobileNav();
    app.innerHTML = pageGate(); bindGate(); return;
  }

  renderHeader();
  renderMobileNav();

  if(path==='/' || path===''){ app.innerHTML = pageHome(); bindHome(); return; }
  if(segs[0]==='properties'){ app.innerHTML = pageProperties(params); bindProperties(); return; }
  if(segs[0]==='property' && segs[1]){ await pageDetail(segs[1]); return; }
  if(segs[0]==='login'){ app.innerHTML = pageLogin(); bindAuth(); return; }
  if(segs[0]==='register'){ app.innerHTML = pageRegister(); bindAuth(); return; }
  if(segs[0]==='about'){ app.innerHTML = pageAbout(); return; }
  if(segs[0]==='contact'){ app.innerHTML = pageContact(); bindContactPage(); return; }
  if(segs[0]==='saved'){ app.innerHTML = pageSaved(); bindProperties(); return; }
  if(segs[0]==='admin'){ requireRole('admin') && renderDashboard('admin', segs, params); return; }
  if(segs[0]==='associate'){ requireRole('associate') && renderDashboard('associate', segs, params); return; }
  app.innerHTML = `<div class="wrap center-note"><h3 class="serif">Page not found</h3><p>That page doesn't exist. <a href="#/" style="color:var(--brass-deep);font-weight:600;">Go home →</a></p></div>`;
}

function requireRole(role){
  const u = currentUser();
  if(!u){ toast('Please log in to continue','error'); go('#/login'); return false; }
  if(u.role!==role){ toast('You do not have access to that area','error'); go(u.role==='admin'?'#/admin':'#/associate'); return false; }
  return true;
}

function renderHeader(){
  const {path} = parseHash();
  const u = currentUser();
  const gated = isGated();
  const navLinks = gated ? [] : [
    ['#/', 'Home', path==='/'||path===''],
    ['#/properties', 'Properties', path==='/properties'],
    ['#/about', 'About Us', path==='/about'],
    ['#/contact', 'Contact', path==='/contact'],
  ];
  document.getElementById('nav-desktop').innerHTML = navLinks.map(([h,l,a])=>`<a href="${h}" class="${a?'active':''}">${l}</a>`).join('');

  const actions = document.getElementById('top-actions');
  if(gated){
    actions.innerHTML = `<a href="#/login" class="btn btn-ghost btn-sm">Associate / Admin Login</a>`;
    return;
  }
  const cust = currentCustomer();
  const customerBtn = `<button class="btn ${cust?'btn-outline':'btn-ghost'} btn-sm" id="customer-login-btn" title="${cust?'Logged in as '+cust.name:'Customer Login'}">${cust ? '☺ '+cust.name.split(' ')[0] : '☺ Customer Login'}</button>`;
  // Desktop shows the full set of buttons; mobile shows only the ☰ menu
  // (everything else lives inside the drawer) so the bar never overflows.
  let buttonsHtml;
  if(u){
    buttonsHtml = `
      ${customerBtn}
      <a href="#/${u.role==='admin'?'admin':'associate'}" class="btn btn-ghost btn-sm">Dashboard</a>
      <button class="icon-btn" data-action="logout" title="Log out">⎋</button>`;
  } else {
    buttonsHtml = `
      ${customerBtn}
      <a href="#/login" class="btn btn-ghost btn-sm">Log in</a>
      <a href="#/register" class="btn btn-primary btn-sm">List Your Property</a>`;
  }
  actions.innerHTML = `<div class="top-actions-buttons">${buttonsHtml}</div><button class="mobile-menu-btn" data-action="open-drawer">☰</button>`;
  document.getElementById('customer-login-btn')?.addEventListener('click', openCustomerLoginModal);
}

function renderMobileNav(){
  if(isGated()){ document.getElementById('mobile-nav').innerHTML=''; return; }
  const {path} = parseHash();
  const u = currentUser();
  const addHref = u ? (u.role==='admin' ? '#/admin/add-property' : '#/associate/add-property') : '#/login';
  const profHref = u ? (u.role==='admin' ? '#/admin' : '#/associate') : '#/login';
  const items = [
    ['#/', '⌂', 'Home', path==='/'||path===''],
    ['#/properties', '⌕', 'Search', path==='/properties'],
    [addHref, '＋', 'Add', path.includes('add-property')],
    ['#/saved', '♡', 'Saved', path==='/saved'],
    [profHref, '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" style="vertical-align:-2px;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>', 'Profile', path==='/admin'||path==='/associate'],
  ];
  document.getElementById('mobile-nav').innerHTML = items.map(([h,i,l,a])=>
    `<a href="${h}" class="${a?'active':''}"><span class="mn-ico">${i}</span>${l}</a>`).join('');
}

document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  if(action==='open-drawer') openDrawer();
  if(action==='close-drawer') closeDrawer();
  if(action==='logout') doLogout();
});

async function doLogout(){
  // Logs out whichever session is active — associate/admin, customer, or both —
  // so the button always works no matter which kind of login is on this device.
  let loggedOutSomething = false;
  if(SESSION){
    SESSION = null;
    await storeSet('session', {userId:null}, false);
    loggedOutSomething = true;
  }
  if(DB.customerSession){
    DB.customerSession = null;
    await storeSet('customerSession', null, false);
    loggedOutSomething = true;
  }
  if(loggedOutSomething) toast('Logged out');
  go('#/');
}

function bindHome(){
  document.getElementById('home-search')?.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const p = new URLSearchParams();
    if(f.get('q')) p.set('q', f.get('q'));
    if(f.get('type')) p.set('type', f.get('type'));
    if(f.get('min')) p.set('min', f.get('min'));
    if(f.get('max')) p.set('max', f.get('max'));
    go('#/properties?'+p.toString());
  });
}

function propCard(p){
  const u = currentUser();
  const isFav = DB.favorites.includes(p.slug);
  return `
  <div class="card-prop" data-slug="${p.slug}">
    <a href="#/property/${p.slug}" class="cp-img">
      <img src="${p.images[0]||''}" alt="${esc(p.title)}" loading="lazy">
      <div class="cp-badges">
        ${p.featured?'<span class="badge featured">Featured</span>':''}
        <span class="badge ${p.status}">${p.status}</span>
      </div>
      <button class="cp-fav" data-action="toggle-fav" data-slug="${p.slug}" title="Save">${isFav?'♥':'♡'}</button>
    </a>
    <div class="cp-body">
      <span class="cp-type">${p.type}</span>
      <a href="#/property/${p.slug}"><h3 class="cp-title">${esc(p.title)}</h3></a>
      <div class="cp-loc">📍 ${esc(p.locality)}, ${esc(p.city)}</div>
      <div class="cp-meta"><span>${p.area} ${p.unit}</span>${p.bedrooms?`<span>${p.bedrooms} Bed</span>`:''}${p.bathrooms?`<span>${p.bathrooms} Bath</span>`:''}</div>
      <div class="cp-foot">
        <span class="cp-price">${money(p.price)}</span>
        <a href="#/property/${p.slug}" class="btn btn-outline btn-sm">View Details</a>
      </div>
    </div>
  </div>`;
}

function pageProperties(params){
  const list = filterProps(params);
  const q = params.get('q')||'';
  return `
  <div class="listing-head">
    <div class="wrap">
      <h1 class="serif" style="font-size:1.5rem;color:var(--forest-deep);margin-bottom:4px;">Find Your Perfect Property</h1>
      <p class="muted" style="font-size:.9rem;margin-bottom:14px;max-width:60ch;">Every home, shop, farm and plot below has earned its place here — reviewed by our team, so you can browse with confidence and shortlist without second-guessing.</p>
      <div class="filters-toggle">
        <span class="muted" style="font-size:.85rem;">${list.length} results</span>
        <button class="btn btn-ghost btn-sm" id="toggle-filters">Filters ▾</button>
      </div>
      <form id="filters-form" class="filters-panel" style="grid-template-columns:1fr;gap:10px;">
        <div class="filters-bar">
          <div class="field"><label>Search</label><input name="q" value="${esc(q)}" placeholder="Title, locality, ID..."></div>
          <div class="field"><label>City</label><input name="city" value="${esc(params.get('city')||'')}" placeholder="e.g. Agra"></div>
          <div class="field"><label>Type</label><select name="type">
            <option value="">Any</option>${PROPERTY_TYPES.map(t=>`<option ${params.get('type')===t?'selected':''}>${t}</option>`).join('')}
          </select></div>
          <div class="field"><label>Min Price</label><input name="min" type="number" value="${esc(params.get('min')||'')}"></div>
          <div class="field"><label>Max Price</label><input name="max" type="number" value="${esc(params.get('max')||'')}"></div>
          <div class="field"><label>Status</label><select name="status">
            <option value="">Any</option><option ${params.get('status')==='available'?'selected':''}>available</option><option ${params.get('status')==='hold'?'selected':''}>hold</option><option ${params.get('status')==='sold'?'selected':''}>sold</option>
          </select></div>
          <button class="btn btn-primary" type="submit">Apply</button>
        </div>
      </form>
    </div>
  </div>
  <div class="wrap">
    <div class="result-toolbar">
      <span class="muted" style="font-size:.85rem;">${list.length} propert${list.length===1?'y':'ies'} found</span>
      <div style="display:flex;gap:10px;align-items:center;">
        <select id="sort-select" class="tag-select">
          <option value="new">Newest first</option>
          <option value="price_low">Price: Low to High</option>
          <option value="price_high">Price: High to Low</option>
          <option value="area">Area: Largest first</option>
        </select>
        <div class="view-toggle">
          <button data-view="grid" class="${VIEW_MODE==='grid'?'active':''}">Grid</button>
          <button data-view="list" class="${VIEW_MODE==='list'?'active':''}">List</button>
        </div>
      </div>
    </div>
    <div id="results-holder"></div>
  </div>
  <div style="height:40px;"></div>
  `;
}

function filterProps(params){
  let list = DB.properties.filter(p=>p.approval==='approved');
  const q = (params.get('q')||'').toLowerCase();
  if(q) list = list.filter(p => (p.title+p.locality+p.city+p.id).toLowerCase().includes(q));
  const city = (params.get('city')||'').toLowerCase();
  if(city) list = list.filter(p=>p.city.toLowerCase().includes(city));
  const type = params.get('type'); if(type) list = list.filter(p=>p.type===type);
  const status = params.get('status'); if(status) list = list.filter(p=>p.status===status);
  const min = Number(params.get('min')||0); if(min) list = list.filter(p=>p.price>=min);
  const max = Number(params.get('max')||0); if(max) list = list.filter(p=>p.price<=max);
  return list;
}

function renderResults(params){
  let list = filterProps(params);
  const sort = document.getElementById('sort-select')?.value || 'new';
  if(sort==='price_low') list.sort((a,b)=>a.price-b.price);
  else if(sort==='price_high') list.sort((a,b)=>b.price-a.price);
  else if(sort==='area') list.sort((a,b)=>b.area-a.area);
  else list.sort((a,b)=>b.createdAt-a.createdAt);

  const holder = document.getElementById('results-holder');
  if(!list.length){
    holder.innerHTML = `<div class="empty-state"><h3>No properties match your search</h3><p>Try widening your filters or browse all listings.</p><br><a href="#/properties" class="btn btn-outline">Clear filters</a></div>`;
    return;
  }
  holder.innerHTML = `<div class="grid-cards ${VIEW_MODE==='list'?'list-view':''}">${list.map(propCard).join('')}</div>`;
}

function bindProperties(){
  const {params} = parseHash();
  renderResults(params);
  document.getElementById('toggle-filters')?.addEventListener('click', ()=>{
    filtersOpen = !filtersOpen;
    document.querySelector('.filters-panel').classList.toggle('open', filtersOpen);
  });
  document.getElementById('filters-form')?.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const p = new URLSearchParams();
    for(const [k,v] of f.entries()) if(v) p.set(k,v);
    go('#/properties?'+p.toString());
  });
  document.getElementById('sort-select')?.addEventListener('change', ()=>renderResults(params));
  document.querySelectorAll('.view-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{ VIEW_MODE = b.dataset.view;
      document.querySelectorAll('.view-toggle button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); renderResults(params);
    });
  });
  document.querySelectorAll('[data-action="toggle-fav"]').forEach(b=>{
    b.addEventListener('click', e=>{ e.preventDefault(); toggleFav(b.dataset.slug); });
  });
}

async function toggleFav(slug){
  const i = DB.favorites.indexOf(slug);
  if(i>-1) DB.favorites.splice(i,1); else DB.favorites.push(slug);
  await persistFavorites();
  document.querySelectorAll(`[data-action="toggle-fav"][data-slug="${slug}"]`).forEach(b=>b.textContent = DB.favorites.includes(slug)?'♥':'♡');
  toast(DB.favorites.includes(slug) ? 'Saved to your list' : 'Removed from saved');
}

function pageSaved(){
  const list = DB.properties.filter(p=>DB.favorites.includes(p.slug));
  return `<div class="wrap pad">
    <div class="section-head"><div><h2>Saved Properties</h2><p>Properties you've bookmarked on this device.</p></div></div>

}

function bindDetail(p, images, shareUrl){
  document.querySelectorAll('.thumbstrip img, .side-imgs .thumb').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = Number(el.dataset.idx);
      openLightbox(images, idx);
    });
  });
  document.getElementById('main-img-click')?.addEventListener('click', ()=>openLightbox(images,0));
  document.getElementById('fav-btn')?.addEventListener('click', ()=>{ toggleFavDetail(p.slug); });
  document.getElementById('copy-link-btn')?.addEventListener('click', ()=>{
    navigator.clipboard?.writeText(shareUrl).then(()=>toast('Link copied to clipboard','success')).catch(()=>toast('Could not copy link','error'));
  });
  document.getElementById('print-btn')?.addEventListener('click', ()=>window.print());
  document.getElementById('share-btn')?.addEventListener('click', ()=>openShareModal(p, shareUrl));
  document.getElementById('enquiry-form')?.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const lead = {id:uid('l_'), name:f.get('name'), phone:f.get('phone'), email:f.get('email')||'',
      message:f.get('message'), propertyId:p.id, associateId:p.associateId, status:'New', createdAt:Date.now()};
    DB.leads.unshift(lead); await persistLeads();
    toast('Enquiry sent! The associate will contact you shortly.','success');
    e.target.reset();
  });
}
function toggleFavDetail(slug){
  toggleFav(slug);
  const btn = document.getElementById('fav-btn');
  if(btn) btn.innerHTML = DB.favorites.includes(slug) ? '♥ Saved' : '♡ Save';
}

function openLightbox(images, idx){
  lightboxImages = images; lightboxIdx = idx;
  const box = document.createElement('div');
  box.className = 'lightbox'; box.id = 'lightbox';
  box.innerHTML = lightboxInner();
  document.body.appendChild(box);
  bindLightbox();
}
function lightboxInner(){
  return `
    <button class="lb-close" data-lb="close">✕</button>
    <img src="${lightboxImages[lightboxIdx]}" alt="">
    <div class="lb-nav"><button data-lb="prev">‹</button><button data-lb="next">›</button></div>
    <div class="lb-count">${lightboxIdx+1} / ${lightboxImages.length}</div>`;
}
function bindLightbox(){
  const box = document.getElementById('lightbox');
  box.addEventListener('click', e=>{
    const act = e.target.closest('[data-lb]')?.dataset.lb;
    if(act==='close'){ box.remove(); }
    if(act==='prev'){ lightboxIdx = (lightboxIdx-1+lightboxImages.length)%lightboxImages.length; box.innerHTML = lightboxInner(); }
    if(act==='next'){ lightboxIdx = (lightboxIdx+1)%lightboxImages.length; box.innerHTML = lightboxInner(); }
  });
}

function openShareModal(p, shareUrl){
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim'; scrim.id = 'share-scrim';
  const waText = encodeURIComponent(`${p.title} — ${money(p.price)}\n${shareUrl}`);
  scrim.innerHTML = `
    <div class="modal-box">
      <h3>Share this property</h3>
      <div class="share-opt" style="cursor:pointer;" data-href="https://wa.me/?text=${waText}"><span class="sicon">🟢</span> WhatsApp</div>
      <div class="share-opt" style="cursor:pointer;" data-href="https://twitter.com/intent/tweet?text=${waText}"><span class="sicon">𝕏</span> X / Twitter</div>
      <div class="share-opt" style="cursor:pointer;" data-href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}"><span class="sicon">f</span> Facebook</div>
      <div class="share-opt" style="cursor:pointer;" id="modal-copy"><span class="sicon">⎘</span> Copy Link</div>
      <div style="margin-top:16px;"><button class="btn btn-ghost btn-block" id="modal-close">Close</button></div>
    </div>`;
  document.body.appendChild(scrim);
  scrim.querySelectorAll('[data-href]').forEach(el=>el.addEventListener('click', ()=>window.open(el.dataset.href,'_blank')));
  scrim.querySelector('#modal-copy').addEventListener('click', ()=>{ navigator.clipboard?.writeText(shareUrl); toast('Link copied','success'); scrim.remove(); });
  scrim.querySelector('#modal-close').addEventListener('click', ()=>scrim.remove());
  scrim.addEventListener('click', e=>{ if(e.target===scrim) scrim.remove(); });
  if(navigator.share){
    const nativeOpt = document.createElement('div');
    nativeOpt.className='share-opt'; nativeOpt.style.cursor='pointer';
    nativeOpt.innerHTML = `<span class="sicon">⤴</span> More options (native share)`;
    nativeOpt.addEventListener('click', ()=>{ navigator.share({title:p.title, text:p.title, url:shareUrl}); scrim.remove(); });
    scrim.querySelector('.modal-box').insertBefore(nativeOpt, scrim.querySelector('#modal-copy'));
  }
}

async function submitCustomerLogin(name, phoneRaw){
  const cleanName = (name||'').trim();
  const phoneDigits = (phoneRaw||'').replace(/\D/g,'');
  if(!cleanName){ toast('Please enter your name','error'); return false; }
  if(phoneDigits.length !== 10){ toast('Please enter a valid 10-digit phone number','error'); return false; }
  const record = {id:uid('c_'), name:cleanName, phone: phoneDigits, createdAt: Date.now()};
  DB.customers.unshift(record);
  await persistCustomers();
  await storeSet('customerSession', {id:record.id, name:cleanName, phone: phoneDigits}, false);
  DB.customerSession = {id:record.id, name:cleanName, phone: phoneDigits};
  toast(`Welcome, ${cleanName.split(' ')[0]}!`,'success');
  return true;
}

    if(!ok) return;
    scrim.remove();
    render();
  });
}

function bindGate(){
  document.getElementById('gate-login-form')?.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const ok = await submitCustomerLogin(f.get('name'), f.get('phone'));
    if(ok) render();
  });
}

   ========================================================================= */
function pageAbout(){
  const bg = 'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=1600&q=80&auto=format&fit=crop';
  return `
  <section class="hero" style="padding-bottom:0; background-image:linear-gradient(180deg, rgba(18,33,29,.68), rgba(18,33,29,.9)), url('${bg}'); background-size:cover; background-position:center;"><div class="hero-inner" style="grid-template-columns:1fr;padding-bottom:50px;">
    <div class="eyebrow"><span></span> Since 2015</div>
    <h1 style="max-width:20ch;">Real estate, handled with honesty and local expertise.</h1>
    <p class="sub">We're a boutique property portal built around Agra and Mathura — connecting property owners with genuine buyers through verified listings and a network of on-ground associates.</p>
  </div></section>
  <section class="wrap pad">
    <div class="why-grid">
      <div class="why-item"><div class="num">01</div><h3>Our story</h3><p>Property Finder started as a two-person associate team helping NRI families manage ancestral land near Agra. Today we manage listings across residential, commercial, agricultural and industrial categories.</p></div>
      <div class="why-item"><div class="num">02</div><h3>Our promise</h3><p>Every property is personally verified by our admin team before it's published — no fake listings, no duplicate entries, no hidden charges.</p></div>
      <div class="why-item"><div class="num">03</div><h3>Our associates</h3><p>Local associates who know the roads, the paperwork and the neighbourhood — not call-centre agents reading from a script.</p></div>
      <div class="why-item"><div class="num">04</div><h3>Our reach</h3><p>Covering Agra, Mathura and the surrounding NH-19 and Yamuna Expressway corridors, with more districts added regularly.</p></div>
    </div>
  </section>
  ${footer()}`;
}
function pageContact(){
  return `
  <section class="wrap pad">
    <div class="section-head"><div><h2>Contact Us</h2><p>Have a question about a property, a site visit, or listing your own? We usually reply within a few hours — whichever way suits you best.</p></div></div>
    <div class="pd-layout" style="margin-top:0;">
      <div class="form-section">
        <h3>Send us a message</h3>
        <form id="contact-form" style="display:grid;gap:14px;">
          <div class="form-grid">
            <div class="field"><label>Name</label><input required name="name"></div>
            <div class="field"><label>Phone</label><input required name="phone"></div>
          </div>
          <div class="field"><label>Email</label><input name="email" type="email"></div>
          <div class="field"><label>Message</label><textarea name="message" rows="4" required></textarea></div>
          <button class="btn btn-primary" type="submit">Send Message</button>
        </form>
      </div>
      <div class="contact-card" style="position:static;">
        <h3>Reach us directly</h3>
        <p class="note">Office hours: ${esc(siteSettings().officeHours)}</p>
        <p style="font-size:.9rem;line-height:2;">📍 ${esc(siteSettings().address)}<br>📞 ${esc(siteSettings().phone)}<br>✉ ${esc(siteSettings().email)}</p>
        <a class="btn btn-brass btn-block" style="margin-top:14px;" target="_blank" href="https://wa.me/${esc(siteSettings().whatsapp)}">🟢 Chat on WhatsApp</a>
      </div>
    </div>
  </section>
  ${footer()}`;
}
function bindContactPage(){
  document.getElementById('contact-form')?.addEventListener('submit', e=>{
    e.preventDefault(); toast("Message sent — we'll be in touch shortly.",'success'); e.target.reset();
  });
}

function pageRegister(){
  const bg = 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1600&q=80&auto=format&fit=crop';
  return `<div class="auth-wrap" style="background-image:linear-gradient(180deg, rgba(18,33,29,.6), rgba(18,33,29,.82)), url('${bg}');"><div class="auth-card">
    <h2 class="serif">Become an associate</h2><p class="sub">Register to start listing properties on Property Finder.</p>
    <form id="register-form">
      <div class="field-stack">
        <div class="field"><label>Full Name</label><input required name="name"></div>
        <div class="field"><label>Email</label><input required name="email" type="email"></div>
        <div class="field"><label>Phone</label><input required name="phone"></div>
        <div class="field"><label>Password</label><input required name="password" type="password" minlength="4"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="#/login">Log in</a></p>
    <p class="auth-switch"><a href="#/">← Back to home</a></p>
  </div></div>`;
}
function bindAuth(){
  document.getElementById('login-form')?.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const u = DB.users.find(x=>x.email.toLowerCase()===f.get('email').toLowerCase() && x.password===f.get('password'));
    if(!u){ toast('Invalid email or password','error'); return; }
    if(u.isActive===false){ toast('Your associate account is inactive. Contact the Admin.','error'); return; }
    const loginAt = Date.now();
    u.lastLoginAt = loginAt;
    u.loginCount = (u.loginCount || 0) + 1;
    u.loginHistory = Array.isArray(u.loginHistory) ? u.loginHistory : [];
    u.loginHistory.unshift({
      at: loginAt,
      device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
      browser: navigator.userAgent
    });
    u.loginHistory = u.loginHistory.slice(0,50);
    await persistUsers();
    SESSION = u.id; await storeSet('session', {userId:u.id}, false);
    toast(`Welcome, ${u.name.split(' ')[0]}!`,'success');
    go(u.role==='admin' ? '#/admin' : '#/associate');
  });
  document.getElementById('register-form')?.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    if(DB.users.some(x=>x.email.toLowerCase()===f.get('email').toLowerCase())){ toast('An account with this email already exists','error'); return; }
    const u = {id:uid('u_'), name:f.get('name'), email:f.get('email'), phone:f.get('phone'), password:f.get('password'), role:'associate', createdAt:Date.now(), isActive:true, lastLoginAt:Date.now(), loginHistory:[Date.now()]};
    DB.users.push(u); await persistUsers();
    SESSION = u.id; await storeSet('session', {userId:u.id}, false);
    toast('Account created — welcome aboard!','success');
    go('#/associate');
  });
}

/* =========================================================================
   DASHBOARDS (Admin + Associate)
   ========================================================================= */
function statusBadge(s){ return `<span class="badge ${s}">${s}</span>`; }

function sideLinks(role){
  if(role==='admin') return [
    ['#/admin','Dashboard',null],['#/admin/properties','All Properties',null],['#/admin/add-property','Add Property',null],
    ['#/admin/pending','Pending Approval',null],['#/admin/approved','Approved Properties',null],['#/admin/sold','Sold Properties',null],
    ['#/admin/associates','Associates',null],['#/admin/login-activity','Login Activity',null],['#/admin/leads','Leads',null],
    ['#/admin/customers','Customers',null],['#/admin/featured','Featured Properties',null],
    ['#/admin/categories','Categories',null],['#/admin/reports','Reports',null],['#/admin/settings','Settings',null],
  ];
  return [
    ['#/associate','Dashboard',null],['#/associate/properties','My Properties',null],['#/associate/add-property','Add Property',null],
    ['#/associate/pending','Pending',null],['#/associate/approved','Approved',null],['#/associate/leads','Leads',null],['#/associate/profile','Profile',null],
  ];
}

function renderDashboard(role, segs, params){
  const app = document.getElementById('app');
  const sub = segs[1] || '';
  const links = sideLinks(role);
  const activeHref = '#/'+segs.join('/');
  app.innerHTML = `
  <div class="dash-shell">
    <aside class="dash-side">
      <div class="side-label">Menu</div>
      ${links.map(([h,l])=>`<a href="${h}" class="${h===activeHref || (h==='#/'+role && !sub) ? 'active':''}">${l}</a>`).join('')}
    </aside>
    <div class="dash-main">
      <div class="mobile-dash-tabs">${links.map(([h,l])=>`<a href="${h}" class="${h===activeHref || (h==='#/'+role && !sub) ? 'active':''}">${l}</a>`).join('')}</div>
      <div id="dash-content"></div>
    </div>
  </div>`;
  const content = document.getElementById('dash-content');
  const u = currentUser();

  if(role==='admin'){
    if(sub==='' ) return renderAdminHome(content);
    if(sub==='properties') return renderPropTable(content, DB.properties, 'All Properties', true);
    if(sub==='pending') return renderPropTable(content, DB.properties.filter(p=>p.approval==='pending'), 'Pending Approval', true);
    if(sub==='approved') return renderPropTable(content, DB.properties.filter(p=>p.approval==='approved'), 'Approved Properties', true);
    if(sub==='sold') return renderPropTable(content, DB.properties.filter(p=>p.status==='sold'), 'Sold Properties', true);
    if(sub==='featured') return renderPropTable(content, DB.properties.filter(p=>p.featured), 'Featured Properties', true);
    if(sub==='associates') return renderAssociates(content);
    if(sub==='login-activity') return renderLoginActivity(content);
    if(sub==='leads') return renderLeads(content, true);
    if(sub==='customers') return renderCustomers(content);
    if(sub==='categories') return renderCategories(content);
    if(sub==='reports') return renderReports(content);
    if(sub==='settings') return renderSettings(content);
    if(sub==='add-property') return renderPropForm(content, null, 'admin');
    if(sub==='property' && segs[2] && segs[3]==='edit') return renderPropForm(content, DB.properties.find(p=>p.id===segs[2]), 'admin');
  } else {
    const mine = DB.properties.filter(p=>p.associateId===u.id);
    if(sub==='') return renderAssocHome(content, mine);
    if(sub==='properties') return renderPropTable(content, mine, 'My Properties', false);
    if(sub==='pending') return renderPropTable(content, mine.filter(p=>p.approval==='pending'), 'Pending', false);
    if(sub==='approved') return renderPropTable(content, mine.filter(p=>p.approval==='approved'), 'Approved', false);
    if(sub==='leads') return renderLeads(content, false);
    if(sub==='profile') return renderProfile(content);
    if(sub==='add-property') return renderPropForm(content, null, 'associate');
    if(sub==='property' && segs[2] && segs[3]==='edit'){
      const pr = mine.find(p=>p.id===segs[2]);
      if(!pr){ content.innerHTML = `<div class="empty-state"><h3>Not found</h3></div>`; return; }
      return renderPropForm(content, pr, 'associate');
    }
  }
  content.innerHTML = `<div class="empty-state"><h3>Coming soon</h3></div>`;
}

function renderAdminHome(content){
  const props = DB.properties;
  const stats = [
    ['Total Properties', props.length],
    ['Available', props.filter(p=>p.status==='available').length],
    ['Pending Approval', props.filter(p=>p.approval==='pending').length],
    ['Sold', props.filter(p=>p.status==='sold').length],
    ['Associates', DB.users.filter(u=>u.role==='associate').length],
    ['New Leads', DB.leads.filter(l=>l.status==='New').length],
  ];
  const recentPending = props.filter(p=>p.approval==='pending').slice(0,5);
  const recentLeads = [...DB.leads].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  content.innerHTML = `
    <div class="dash-head"><div><h1>Welcome back, ${esc(currentUser().name.split(' ')[0])}</h1><p>Here's what's happening across the portal today.</p></div>
      <a href="#/admin/add-property" class="btn btn-primary">+ Add Property</a></div>
    <div class="stat-grid">${stats.map(([l,v])=>`<div class="stat-card"><b>${v}</b><span>${l}</span></div>`).join('')}</div>

      <div class="panel">
        <div class="panel-head"><h3>Awaiting your approval</h3><a href="#/admin/pending" class="link-more">View all →</a></div>
        ${recentPending.length ? tableRows(recentPending, true) : `<p class="muted" style="padding:18px;">Nothing pending — all caught up.</p>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Recent leads</h3><a href="#/admin/leads" class="link-more">View all →</a></div>
        ${recentLeads.length ? leadRows(recentLeads) : `<p class="muted" style="padding:18px;">No leads yet.</p>`}

  return `<div class="table-wrap"><table>
    <thead><tr><th>Property</th><th>Type</th><th>Price</th><th>Status</th><th>Approval</th><th>Associate</th><th></th></tr></thead>
    <tbody>${list.map(p=>`
      <tr>
        <td><div class="row-title"><img class="row-thumb" src="${p.images[0]||''}"><div><b>${esc(p.title)}</b><small>${esc(p.city)} · ${esc(p.locality)}</small></div></div></td>
        <td>${p.type}</td><td>${money(p.price)}</td>
        <td>${statusBadge(p.status)}</td>
        <td>${statusBadge(p.approval)}</td>
        <td>${esc(associateName(p.associateId))}</td>
        <td><div class="actions-cell">
          <a class="btn btn-ghost btn-sm" href="#/property/${p.slug}" target="_blank">View</a>
          <a class="btn btn-ghost btn-sm" href="#/${isAdmin?'admin':'associate'}/property/${p.id}/edit">Edit</a>
          ${isAdmin && p.approval==='pending' ? `<button class="btn btn-primary btn-sm" data-approve="${p.id}">Approve</button><button class="btn btn-danger btn-sm" data-reject="${p.id}">Reject</button>`:''}

        </div></td>
      </tr>`).join('')}

function renderPropTable(content, list, title, isAdmin){
  content.innerHTML = `
    <div class="dash-head"><div><h1>${title}</h1><p>${list.length} propert${list.length===1?'y':'ies'}</p></div>
      <a href="#/${isAdmin?'admin':'associate'}/add-property" class="btn btn-primary">+ Add Property</a></div>
    <div class="panel">${list.length ? tableRows(list, isAdmin) : `<div class="empty-state"><h3>Nothing here yet</h3></div>`}</div>`;
  bindPropTableActions(content);
}

function bindPropTableActions(content){
  content.querySelectorAll('[data-delete-property]').forEach(b=>b.addEventListener('click', async ()=>{
    const p=DB.properties.find(x=>x.id===b.dataset.deleteProperty); if(!p) return;
    if(!confirm('Delete this property permanently?')) return;
    DB.properties=DB.properties.filter(x=>x.id!==p.id);
    DB.leads=DB.leads.filter(l=>l.propertyId!==p.id);
    await persistProperties(); await persistLeads();
    toast('Property deleted successfully','success'); render();
  }));
  content.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', async ()=>{
    const p = DB.properties.find(x=>x.id===b.dataset.approve);
    p.approval='approved'; p.rejectionReason=''; await persistProperties();
    toast('Property approved and published','success'); render();
  }));
  content.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click', ()=>{
    openRejectModal(b.dataset.reject);
  }));
}
function openRejectModal(propId){
  const scrim = document.createElement('div'); scrim.className='modal-scrim';
  scrim.innerHTML = `<div class="modal-box"><h3>Reject property</h3>
    <div class="field"><label>Reason for rejection</label><textarea id="reject-reason" rows="3" placeholder="e.g. Photos unclear, missing price details..."></textarea></div>
    <div class="form-actions" style="margin-top:14px;"><button class="btn btn-ghost" id="rj-cancel">Cancel</button><button class="btn btn-danger" id="rj-confirm">Reject Property</button></div>
    </div>`;
  document.body.appendChild(scrim);
  scrim.querySelector('#rj-cancel').addEventListener('click', ()=>scrim.remove());
  scrim.addEventListener('click', e=>{ if(e.target===scrim) scrim.remove(); });
  scrim.querySelector('#rj-confirm').addEventListener('click', async ()=>{
    const p = DB.properties.find(x=>x.id===propId);
    p.approval='rejected'; p.rejectionReason = document.getElementById('reject-reason').value || 'Not specified';
    await persistProperties(); scrim.remove(); toast('Property rejected','error'); render();
  });
}

        <td style="max-width:220px;">${esc(l.message.slice(0,60))}${l.message.length>60?'…':''}</td>
        <td><select class="tag-select" data-lead="${l.id}">
          ${['New','Contacted','Follow-up','Converted','Closed'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}
        </select></td>
        <td><small class="muted">${fmtDate(l.createdAt)}</small></td>

}
function bindLeadActions(content){
  content.querySelectorAll('[data-lead]').forEach(s=>s.addEventListener('change', async ()=>{
    const l = DB.leads.find(x=>x.id===s.dataset.lead); l.status = s.value; await persistLeads(); toast('Lead status updated','success');
  }));
}
function renderLeads(content, isAdmin){
  const u = currentUser();
  const list = isAdmin ? DB.leads : DB.leads.filter(l=>l.associateId===u.id);
  content.innerHTML = `
    <div class="dash-head"><div><h1>Leads</h1><p>${list.length} total enquiries</p></div></div>
    <div class="panel">${list.length ? leadRows([...list].sort((a,b)=>b.createdAt-a.createdAt)) : `<div class="empty-state"><h3>No leads yet</h3><p>Enquiries from your property pages will show up here.</p></div>`}</div>`;
  bindLeadActions(content);
}

function renderCustomers(content){
  const list = [...DB.customers].sort((a,b)=>b.createdAt-a.createdAt);
  content.innerHTML = `
    <div class="dash-head"><div><h1>Customers</h1><p>${list.length} customer${list.length===1?'':'s'} logged in via the website · Visible to admin only.</p></div></div>
    <div class="panel">${list.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Name</th><th>Phone</th><th>Registered</th><th></th><th></th></tr></thead>
      <tbody>${list.map(c=>`<tr>
        <td><b>${esc(c.name)}</b></td>
        <td>${esc(c.phone)}</td>
        <td><small class="muted">${fmtDate(c.createdAt)}</small></td>
        <td><a class="btn btn-ghost btn-sm" target="_blank" href="https://wa.me/91${c.phone.replace(/\D/g,'')}">WhatsApp</a></td>
        <td><button type="button" class="btn btn-ghost btn-sm" style="color:var(--danger);" data-delete-customer="${c.id}">Delete</button></td>
      </tr>`).join('')}</tbody></table></div>` : `<div class="empty-state"><h3>No customers yet</h3><p>People who use "Customer Login" on the website will show up here.</p></div>`}</div>`;
  content.querySelectorAll('[data-delete-customer]').forEach(b=>b.addEventListener('click', async ()=>{
    const c = DB.customers.find(x=>x.id===b.dataset.deleteCustomer); if(!c) return;
    if(!confirm(`Delete ${c.name}'s record permanently?`)) return;
    DB.customers = DB.customers.filter(x=>x.id!==c.id);
    // if this customer is currently logged in on this device, log them out too
    if(DB.customerSession && DB.customerSession.id===c.id){
      DB.customerSession = null;
      await storeSet('customerSession', null, false);
    }
    await persistCustomers();
    toast('Customer deleted','success'); render();
  }));
}

function renderAssociates(content){
  const assocs = DB.users.filter(u=>u.role==='associate');
  content.innerHTML = `
    <div class="dash-head">
      <div><h1>Associates</h1><p>${assocs.length} registered associates · Admin can manage access and login activity.</p></div>
    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Properties</th><th>Status</th><th>Last Login</th><th>Joined</th><th>Action</th></tr></thead>
      <tbody>${assocs.map(a=>`<tr>
        <td><b>${esc(a.name)}</b></td>
        <td>${esc(a.email)}</td>
        <td>${esc(a.phone)}</td>
        <td>${DB.properties.filter(p=>p.associateId===a.id).length}</td>
        <td>${a.isActive===false ? statusBadge('sold') : statusBadge('approved')}</td>
        <td><small class="muted">${a.lastLoginAt ? fmtDate(a.lastLoginAt) : 'Never'}</small></td>
        <td><small class="muted">${fmtDate(a.createdAt)}</small></td>
        <td>
          <button class="btn btn-outline btn-sm assoc-toggle" data-id="${a.id}">${a.isActive===false?'Activate':'Deactivate'}</button>
          <button class="btn btn-ghost btn-sm assoc-reset" data-id="${a.id}">Reset Password</button>
        </td>
      </tr>`).join('')}
      </tbody></table></div></div>
    <div class="panel" style="margin-top:14px;padding:14px;">
      <small class="muted">Security: actual associate passwords are never shown here. Use <b>Reset Password</b> to set a new password.</small>
    </div>`;

  content.querySelectorAll('.assoc-toggle').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const a = DB.users.find(x=>x.id===btn.dataset.id);
      if(!a) return;
      a.isActive = a.isActive===false;
      await persistUsers();
      toast(a.isActive ? 'Associate activated' : 'Associate deactivated','success');
      render();
    });
  });

  content.querySelectorAll('.assoc-reset').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const a = DB.users.find(x=>x.id===btn.dataset.id);
      if(!a) return;
      const next = prompt(`Set a new password for ${a.name}:`);
      if(next===null) return;
      if(next.length < 4){ toast('Password must be at least 4 characters','error'); return; }
      a.password = next;
      await persistUsers();
      toast('Password reset successfully','success');
    });
  });
}

function renderCategories(content){
  const counts = {};
  PROPERTY_TYPES.forEach(t=>counts[t]=DB.properties.filter(p=>p.type===t && p.approval==='approved').length);
  content.innerHTML = `
    <div class="dash-head"><div><h1>Categories</h1><p>Live property counts per category.</p></div></div>
    <div class="stat-grid">${Object.entries(counts).map(([k,v])=>`<div class="stat-card"><b>${v}</b><span>${k}</span></div>`).join('')}</div>
