}

function renderReports(content){
  const props = DB.properties;
  const totalValue = props.filter(p=>p.approval==='approved').reduce((s,p)=>s+Number(p.price||0),0);
  const byType = PROPERTY_TYPES.map(t=>[t, props.filter(p=>p.type===t).length]);
  const totalViews = props.reduce((s,p)=>s+(p.views||0),0);
  content.innerHTML = `
    <div class="dash-head"><div><h1>Reports</h1><p>Portal performance at a glance.</p></div></div>
    <div class="stat-grid">
      <div class="stat-card"><b>${money(totalValue)}</b><span>Total listed value</span></div>
      <div class="stat-card"><b>${totalViews}</b><span>Total property views</span></div>
      <div class="stat-card"><b>${DB.leads.length}</b><span>Total leads</span></div>
      <div class="stat-card"><b>${DB.leads.filter(l=>l.status==='Converted').length}</b><span>Converted leads</span></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Properties by type</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Type</th><th>Count</th></tr></thead>
      <tbody>${byType.map(([t,c])=>`<tr><td>${t}</td><td>${c}</td></tr>`).join('')}</tbody></table></div></div>`;
}


function renderLoginActivity(el){
  const associates = DB.users.filter(u=>u.role==='associate');
  const allLogins = [];
  associates.forEach(u=>{
    (Array.isArray(u.loginHistory)?u.loginHistory:[]).forEach(h=>{
      const at = typeof h === 'object' ? h.at : h;
      allLogins.push({user:u, at, device:typeof h==='object' ? h.device : '-', browser:typeof h==='object' ? h.browser : '-' });
    });
  });
  allLogins.sort((a,b)=>(Number(b.at)||0)-(Number(a.at)||0));
  el.innerHTML = `
    <div class="dash-head">
      <div><h1>Login Activity</h1><p>Admin-only: see who logged in, when they logged in, and device/browser details.</p></div>
      <span class="badge approved">ADMIN ONLY</span>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Associate Accounts</h3><span class="muted">${associates.length} associates</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Last Login</th><th>Total Logins</th></tr></thead>
        <tbody>${associates.length ? associates.map(u=>`<tr>
          <td><b>${esc(u.name||'-')}</b></td><td>${esc(u.email||'-')}</td><td>${esc(u.phone||'-')}</td>

function renderPropForm(content, existing, role){
  currentImages = existing ? [...existing.images] : [];
  coverImageIdx = 0;
  const p = existing || {};
  content.innerHTML = `
    <div class="dash-head"><div><h1>${existing?'Edit Property':'Add New Property'}</h1><p>${existing?'Update the details and resubmit if needed.':'Fill in the details below. Submitted properties go to admin for approval.'}</p></div></div>
    <form id="prop-form">
      <div class="form-section"><h3>Basic Information</h3>
        <div class="form-grid">
          <div class="field span-2"><label>Property Title</label><input name="title" value="${esc(p.title||'')}" placeholder="e.g. 100 Gaj Commercial Plot on Fatehabad Road"></div>
          <div class="field"><label>Property Type</label><select name="type">${PROPERTY_TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
          <div class="field"><label>Status</label><select name="status">
            ${['available','hold','sold'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
          <div class="field span-2"><label>Description</label><textarea name="description" rows="4" placeholder="Describe the property...">${esc(p.description||'')}</textarea></div>
        </div>
      </div>

      <div class="form-section"><h3>Location</h3>
        <div class="form-grid cols-3">
          <div class="field"><label>State</label><input name="state" value="${esc(p.state||'Uttar Pradesh')}"></div>
          <div class="field"><label>City</label><input name="city" value="${esc(p.city||'')}"></div>
          <div class="field"><label>Locality</label><input name="locality" value="${esc(p.locality||'')}"></div>
          <div class="field span-2"><label>Address</label><input name="address" value="${esc(p.address||'')}"></div>
          <div class="field"><label>Landmark</label><input name="landmark" value="${esc(p.landmark||'')}"></div>
          <div class="field span-2"><label>Google Maps URL</label><input name="mapUrl" value="${esc(p.mapUrl||'')}" placeholder="https://maps.google.com/..."></div>
          <div class="field"><label>Latitude</label><input name="lat" value="${esc(p.lat||'')}"></div>
          <div class="field"><label>Longitude</label><input name="lng" value="${esc(p.lng||'')}"></div>
        </div>
      </div>

      <div class="form-section"><h3>Area</h3>
        <div class="form-grid cols-3">
          <div class="field"><label>Area</label><input type="number" name="area" value="${esc(p.area||'')}"></div>
          <div class="field"><label>Unit</label><select name="unit">${['Sq. Ft.','Sq. Yard','Acre','Bigha','Hectare'].map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
          <div class="field"><label>Front</label><input name="front" value="${esc(p.front||'')}" placeholder="e.g. 40 ft"></div>
          <div class="field"><label>Depth</label><input name="depth" value="${esc(p.depth||'')}" placeholder="e.g. 60 ft"></div>
        </div>
      </div>

      <div class="form-section"><h3>Pricing</h3>
        <div class="form-grid cols-3">
          <div class="field"><label>Total Price (₹)</label><input type="number" name="price" value="${esc(p.price||'')}"></div>
          <div class="field"><label>Price Per Unit (₹)</label><input type="number" name="pricePerUnit" value="${esc(p.pricePerUnit||'')}"></div>
          <div class="field" style="align-self:end;"><label class="checkline"><input type="checkbox" name="negotiable" ${p.negotiable!==false?'checked':''}> Negotiable</label></div>
        </div>
      </div>

      <div class="form-section"><h3>Specifications</h3>
        <div class="form-grid cols-3">
          <div class="field"><label>Road Width</label><input name="roadWidth" value="${esc(p.roadWidth||'')}"></div>
          <div class="field"><label>Facing</label><select name="facing">${['East','West','North','South','North-East','North-West','South-East','South-West'].map(f=>`<option ${p.facing===f?'selected':''}>${f}</option>`).join('')}</select></div>
          <div class="field"><label>Ownership Type</label><select name="ownership">${['Freehold','Leasehold','Co-operative'].map(o=>`<option ${p.ownership===o?'selected':''}>${o}</option>`).join('')}</select></div>

          <div class="field"><label>Construction Year</label><input type="number" name="constructionYear" value="${esc(p.constructionYear||'')}"></div>

          <div class="field"><label>Documents Available</label><input name="documents" value="${esc(p.documents||'')}" placeholder="Registry, Mutation..."></div>
        </div>
      </div>

      <div class="form-section"><h3>Media</h3>
        <div class="field">
          <label>Upload Photos</label>
          <label class="upload-drop" id="img-upload-drop" for="img-file-input">

            <span class="upload-drop-text"><b>Click to upload</b> or drag &amp; drop photos</span>
            <span class="upload-drop-hint">JPG, PNG or WEBP — multiple files allowed</span>

          <label>Upload Property Video</label>
          <label class="upload-drop" id="video-upload-drop" for="video-file-input">

            <span class="upload-drop-text"><b>Click to upload</b> or drag &amp; drop a video</span>
            <span class="upload-drop-hint">MP4 or WEBM recommended</span>
            <input type="file" id="video-file-input" accept="video/*" style="display:none;">

        <button type="submit" class="btn btn-primary" name="_submit" value="1">${existing ? 'Save & Resubmit' : 'Submit for Approval'}</button>

  currentVideo = existing ? (p.video||'') : '';
  renderImgThumbs();
  renderVideoThumb();

  const imgInput = document.getElementById('img-file-input');
  const imgDrop = document.getElementById('img-upload-drop');
  imgInput.addEventListener('change', e=>handleImageFiles(e.target.files));
  ['dragover','dragenter'].forEach(evt=>imgDrop.addEventListener(evt, e=>{ e.preventDefault(); imgDrop.classList.add('drag-over'); }));
  ['dragleave','drop'].forEach(evt=>imgDrop.addEventListener(evt, e=>{ e.preventDefault(); imgDrop.classList.remove('drag-over'); }));
  imgDrop.addEventListener('drop', e=>{ if(e.dataTransfer.files.length) handleImageFiles(e.dataTransfer.files); });

  const videoInput = document.getElementById('video-file-input');
  const videoDrop = document.getElementById('video-upload-drop');
  videoInput.addEventListener('change', e=>{ if(e.target.files[0]) handleVideoFile(e.target.files[0]); });
  ['dragover','dragenter'].forEach(evt=>videoDrop.addEventListener(evt, e=>{ e.preventDefault(); videoDrop.classList.add('drag-over'); }));
  ['dragleave','drop'].forEach(evt=>videoDrop.addEventListener(evt, e=>{ e.preventDefault(); videoDrop.classList.remove('drag-over'); }));
  videoDrop.addEventListener('drop', e=>{ e.preventDefault(); videoDrop.classList.remove('drag-over'); if(e.dataTransfer.files[0]) handleVideoFile(e.dataTransfer.files[0]); });

  document.getElementById('prop-form').addEventListener('submit', e=>submitPropForm(e, existing, role));
}

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}

async function handleImageFiles(fileList){
  const files = Array.from(fileList||[]).filter(f=>f.type.startsWith('image/'));
  if(!files.length) return;
  for(const file of files){
    if(file.size > 8*1024*1024){ toast(`"${file.name}" is over 8MB and was skipped`,'error'); continue; }
    try{
      const dataUrl = await readFileAsDataURL(file);
      currentImages.push(dataUrl);
    }catch(err){ toast(`Could not read "${file.name}"`,'error'); }
  }
  renderImgThumbs();
  document.getElementById('img-file-input').value = '';
}

async function handleVideoFile(file){
  if(!file.type.startsWith('video/')){ toast('Please select a video file','error'); return; }
  if(file.size > 50*1024*1024){ toast('Video must be under 50MB','error'); return; }
  try{
    currentVideo = await readFileAsDataURL(file);
    renderVideoThumb();
  }catch(err){ toast('Could not read video file','error'); }
  document.getElementById('video-file-input').value = '';
}

function renderVideoThumb(){
  const wrap = document.getElementById('video-thumb-wrap');
  if(!wrap) return;
  wrap.innerHTML = currentVideo
    ? `<div class="video-thumb"><video src="${currentVideo}" muted></video><button type="button" id="remove-video-btn">✕ Remove video</button></div>`
    : '';
  const btn = document.getElementById('remove-video-btn');
  if(btn) btn.addEventListener('click', ()=>{ currentVideo=''; renderVideoThumb(); });
}

function renderImgThumbs(){
  const grid = document.getElementById('img-thumb-grid');
  if(!grid) return;
  grid.innerHTML = currentImages.map((img,i)=>`
    <div class="img-thumb ${i===coverImageIdx?'cover':''}">
      <img src="${img}">
      ${i===coverImageIdx?'<span class="cover-tag">Cover</span>':''}
      <button type="button" data-remove="${i}">✕</button>
      ${i!==coverImageIdx?`<button type="button" class="set-cover-btn" data-cover="${i}">Set as cover</button>`:''}
    </div>`).join('') || `<p class="muted" style="font-size:.8rem;">No images added yet.</p>`;
  grid.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = Number(b.dataset.remove); currentImages.splice(idx,1);
    if(coverImageIdx>=currentImages.length) coverImageIdx = 0;
    renderImgThumbs();
  }));
  grid.querySelectorAll('[data-cover]').forEach(b=>b.addEventListener('click', ()=>{
    coverImageIdx = Number(b.dataset.cover); renderImgThumbs();
  }));
}

async function submitPropForm(e, existing, role){
  e.preventDefault();
  const submitter = e.submitter?.name;
  const f = new FormData(e.target);
  if(currentImages.length===0){ toast('Please add at least one image','error'); return; }
  // reorder so cover image is first
  const orderedImages = [currentImages[coverImageIdx], ...currentImages.filter((_,i)=>i!==coverImageIdx)];
  const data = {
    title: f.get('title'), type: f.get('type'), description: f.get('description'),
    state: f.get('state'), city: f.get('city'), locality: f.get('locality'), address: f.get('address'),
    landmark: f.get('landmark'), mapUrl: f.get('mapUrl'), lat: f.get('lat'), lng: f.get('lng'),
    area: Number(f.get('area')||0), unit: f.get('unit'), front: f.get('front'), depth: f.get('depth'),
    price: Number(f.get('price')||0), pricePerUnit: Number(f.get('pricePerUnit')||0), negotiable: f.get('negotiable')==='on',
    roadWidth: f.get('roadWidth'), facing: f.get('facing'), ownership: f.get('ownership'),
    bedrooms: f.get('bedrooms'), bathrooms: f.get('bathrooms'), floors: f.get('floors'),
    constructionYear: f.get('constructionYear'), rera: f.get('rera'), documents: f.get('documents'),
    images: orderedImages, video: currentVideo, status: f.get('status')||'available',
  };
  const u = currentUser();
  const isDraft = submitter==='_saveDraft';

  if(existing){
    Object.assign(existing, data);
    if(!isDraft){ existing.approval = role==='admin' ? 'approved' : 'pending'; existing.rejectionReason=''; }
    await persistProperties();
    toast(isDraft ? 'Draft saved' : 'Property updated'+(role==='associate'?' and resubmitted for approval':''), 'success');
  } else {
    const id = uid('p_');
    const newProp = {
      id, ...data, slug: slugify(data.title)+'-'+id.slice(-5),
      approval: isDraft ? 'pending' : (role==='admin' ? 'approved' : 'pending'),
      featured:false, views:0, associateId: u.id, createdAt: Date.now(),
    };
    DB.properties.unshift(newProp);
    await persistProperties();
    toast(role==='admin' ? 'Property published' : 'Property submitted for admin approval', 'success');
  }
  go('#/'+role+'/properties');
}

   INIT
   ========================================================================= */

  await loadDB();
  if(!location.hash) location.hash = '#/';
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
